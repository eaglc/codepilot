name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, modules, and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Verify whitespace
        run: git diff --check
      - name: Verify module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...

  native-test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: codepilot
          - os: windows-latest
            binary: codepilot.exe
          - os: macos-latest
            binary: codepilot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CODEPILOT_REQUIRE_PYTHON_E2E: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Full offline suite
        run: go test ./... -count=1 -timeout=10m
      - name: Repeated TUI and file-store tests
        run: go test ./internal/ui ./internal/sessionstore/file -count=3 -timeout=10m
      - name: Vet on native platform
        run: go vet ./...
      - name: Build native CLI
        run: go build -trimpath -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o ${{ matrix.binary }} ./cmd/codepilot

  race:
    name: Race-sensitive core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CODEPILOT_REQUIRE_PYTHON_E2E: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Race test stateful core
        run: go test -race ./internal/agent/... ./internal/codingagent/... ./internal/sessionstore/file ./internal/ui -count=1 -timeout=15m

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build target
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA}" -o "dist/codepilot-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/codepilot
